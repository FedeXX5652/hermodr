[project]
name = "hermodr"
version = "0.1.0"
description = "Personal news digest: stories, not articles, summarized by a local model"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "rapidfuzz>=3.0",
    "jinja2>=3.1",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.scripts]
hermodr = "hermodr.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermodr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# urllib3 warns about socks proxies on import; there is none
filterwarnings = ["ignore:SOCKS support in urllib3"]
